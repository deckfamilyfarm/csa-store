# Install this HTTP block first. Certbot adds HTTPS and its HTTP redirect.
# Uses the same CSA Store app as Subscribe, Dropsites, and Turkeys.
server {
    listen 80;
    server_name merchandise.deckfamilyfarm.com;

    location / {
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
