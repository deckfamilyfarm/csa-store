name: Pricing and member financial safeguards
on: [push, pull_request]
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            design/template/vite-app/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm ci --prefix design/template/vite-app
      - run: npm --prefix apps/api run test:stabilization
      - run: docker pull mysql:8.4
      - run: npm --prefix apps/api run test:stabilization:integration
      - run: npm --prefix design/template/vite-app run build
